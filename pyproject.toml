[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.2.0"
description = "Forge - Autonomous AI Terminal Coding Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Charan Balaji" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.40",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "aiofiles>=23.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
all = [
    "anthropic>=0.20.0",
    "openai>=1.20.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
forge = "forge.forge:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]
