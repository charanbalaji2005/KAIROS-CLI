[package]
name = "forge"
version = "0.1.0"
edition = "2021"
authors = ["Forge Agent <forge@forge.dev>"]
description = "Autonomous Terminal Engineer - AI-powered coding agent"
license = "MIT"
repository = "https://github.com/charanbalaji2005/forge-agent"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Terminal UI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Config management
config = "0.14"
dirs = "5.0"

# Regex
regex = "1.10"

# Process management
tokio-process = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation
uuid = { version = "1.10", features = ["v4"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# String utilities
similar = "2.6"
textwrap = "0.16"

# Shell expansion
shellexpand = "3.1"

# Futures
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"

# Clipboard (optional)
# copypasta = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
